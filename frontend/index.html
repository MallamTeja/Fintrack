<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="FinTrack: a personal ledger for income, spending, budgets and savings goals." />
    <meta name="theme-color" content="#f9f5ed" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f613c'/%3E%3Cpath d='M9 8h14M9 13h10M9 18h14M9 24h7' stroke='%23f9f5ed' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>FinTrack</title>
    <script>
      // Apply a saved theme before first paint so the page never flashes the wrong paper.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
